<script>
(function () {
  'use strict';
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var m = String(iso).match(/(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[1] + '.' + m[2] + '.' + m[3] + '.') : esc(iso);
  }
  var listEl = document.getElementById('fileList');
  var loadingEl = document.getElementById('fileLoading');
  var emptyEl = document.getElementById('fileEmpty');

  function item(f) {
    var ext = (f.ext || '').toUpperCase() || 'FILE';
    var href = '/files/' + encodeURIComponent(f.name);
    var meta = [ext, f.size_text, fmtDate(f.modified)].filter(Boolean).join(' · ');
    return '<li class="file-item">' +
      '<span class="file-item__ext" aria-hidden="true">' + esc(ext) + '</span>' +
      '<div class="file-item__body">' +
      '<span class="file-item__title">' + esc(f.title) + '</span>' +
      '<span class="file-item__meta">' + esc(meta) + '</span>' +
      '</div>' +
      '<a class="btn btn--primary btn--sm file-item__dl" href="' + href + '" download>다운로드</a>' +
      '</li>';
  }

  fetch('/api/files')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var files = (data && data.files) || [];
      if (!files.length) {
        listEl.innerHTML = '';
        if (emptyEl) { emptyEl.textContent = '등록된 자료가 없습니다.'; emptyEl.hidden = false; }
        return;
      }
      listEl.innerHTML = files.map(item).join('');
    })
    .catch(function () {
      listEl.innerHTML = '';
      if (loadingEl) loadingEl.hidden = true;
      if (emptyEl) { emptyEl.hidden = false; emptyEl.textContent = '자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'; }
    });
})();
</script>
