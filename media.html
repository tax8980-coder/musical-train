<script>
(function () {
  'use strict';
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var m = String(iso).match(/(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[1] + '.' + m[2] + '.' + m[3] + '.') : esc(iso);
  }
  var gridEl = document.getElementById('mediaGrid');
  var loadingEl = document.getElementById('mediaLoading');
  var emptyEl = document.getElementById('mediaEmpty');

  function card(m) {
    var thumb = m.thumb ? '<img loading="lazy" src="' + esc(m.thumb) + '" alt="" />' : '';
    return '<a class="media-card" href="' + esc(m.url) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="media-card__thumb">' + thumb + '<span class="media-card__play" aria-hidden="true"></span></span>' +
      '<span class="media-card__body">' +
      (m.category ? '<span class="media-card__cat">' + esc(m.category) + '</span>' : '') +
      '<span class="media-card__title">' + esc(m.title) + '</span>' +
      (m.date ? '<span class="media-card__date">' + fmtDate(m.date) + '</span>' : '') +
      '</span></a>';
  }

  fetch('/api/media')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var media = (data && data.media) || [];
      if (loadingEl) loadingEl.hidden = true;
      if (!media.length) {
        gridEl.innerHTML = '';
        if (emptyEl) { emptyEl.hidden = false; emptyEl.textContent = '등록된 영상이 없습니다. 곧 업데이트됩니다.'; }
        return;
      }
      if (emptyEl) emptyEl.hidden = true;
      gridEl.innerHTML = media.map(card).join('');
    })
    .catch(function () {
      if (loadingEl) loadingEl.hidden = true;
      if (emptyEl) { emptyEl.hidden = false; emptyEl.textContent = '영상을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'; }
    });
})();
</script>
