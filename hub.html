<body class="page-sub">
<a class="skip-link" href="#main">본문으로 바로가기</a>

<header class="site-header is-scrolled is-static" id="siteHeader">
  <div class="container site-header__inner">
    <a class="logo" href="index.html" aria-label="세무법인 지율 홈">
      <img class="logo__img" src="assets/images/logo-brand.png?v=2" alt="세무법인 지율"
           onload="this.closest('.logo').classList.add('has-img')" />
      <span class="logo__fallback">
        <span class="logo__mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="hdrLogoG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1E3A5F"/><stop offset=".55" stop-color="#2A5A9A"/><stop offset="1" stop-color="#3B82F6"/>
            </linearGradient></defs>
            <rect width="40" height="40" rx="11" fill="url(#hdrLogoG)"/>
            <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 13.5 H29"/><path d="M20 13.5 V19"/><path d="M20 19 L12 27.5"/><path d="M20 19 L28 27.5"/>
            </g>
          </svg>
        </span>
        <span class="logo__text">세무법인 <b>지율</b></span>
      </span>
      <span class="logo__brand">세무법인</span>
    </a>
    <nav class="gnb-sub" aria-label="바로가기">
      <a href="index.html">세무칼럼</a>
      <a href="intro.html"><span class="nav-label--wide">세무사/업무소개</span><span class="nav-label--narrow">업무분야</span></a>
      <a href="media.html">언론·강의</a>
      <a href="resources.html">자료실</a>
      <a href="faq.html">자주 묻는 질문</a>
      <a class="btn btn--primary btn--sm" href="contact.html"><span class="nav-label--wide">강의요청 및 상담문의</span><span class="nav-label--narrow">상담 문의</span></a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="sub-hero">
    <div class="container">
      <h1 class="sub-hero__title">{{HUB_TITLE}}</h1>
      <p class="sub-hero__lead">{{HUB_LEAD}}</p>
      <div class="container" style="padding:0;margin-top:14px">{{HUB_CHIPS}}</div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <ul class="post-list">
{{HUB_CARDS}}
      </ul>
    </div>
  </section>
</main>

<!-- 모바일 전화 상담 고정 바 -->
<div class="mobile-callbar" aria-label="빠른 상담">
  <a class="mobile-callbar__tel" href="tel:02-552-6436">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3.5l1.8 4.2-2 1.4a11.5 11.5 0 0 0 6.1 6.1l1.4-2L20 15.5V19a1.5 1.5 0 0 1-1.7 1.5A15.5 15.5 0 0 1 3.5 5.7A1.5 1.5 0 0 1 5 4Z"/></svg>
    전화 상담
