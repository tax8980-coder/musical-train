name: 노션 세무칼럼 자동 동기화

# 매일 05:37(KST) = 매일 20:37(UTC) 실행 + 수동 실행(Run workflow) 가능.
#  · 정시(예: 20:00)는 GitHub Actions 부하로 지연·누락되기 쉬워 37분으로 오프피크 배치.
#  · 매일 돌지만 sync_notion.py 는 add-only + 회당 최대 3편이라, 새 칼럼이 없으면 no-op.
#  · 하루가 지연·누락돼도 다음 날 자동으로 이어받음(self-healing) → 주간 정시 크론의 누락 문제 해소.
# GitHub 서버에서 돌기 때문에 홈페이지 서버의 절전 여부와 무관하게 항상 실행됩니다.
on:
  schedule:
    - cron: "37 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 노션 → content/*.md, data/posts.json 동기화
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN 시크릿이 없습니다. Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi
          python sync_notion.py

      - name: 변경분 커밋 & 푸시 (있을 때만)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "노션 세무칼럼 자동 동기화 (GitHub Actions)"
            git push
            echo "새 칼럼을 반영했습니다. 이어서 Cloudtype 재배포로 홈페이지에 반영합니다."
          else
            echo "추가할 새 칼럼이 없습니다(변경 없음)."
          fi

      # 봇 커밋(GITHUB_TOKEN) 푸시는 deploy 워크플로를 자동 트리거하지 않으므로
      # 여기서 직접 Cloudtype 재배포를 호출한다.
      - name: Cloudtype 배포 키 연결
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}
      - name: Cloudtype 재배포(새 칼럼 반영)
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: tax8980/musical-train
          stage: main
          yaml: |
            name: musical-train
            app: dockerfile
            options:
              ports: "8080"
              env:
                - name: JIYUL_ADMIN_TOKEN
                  value: ${{ secrets.JIYUL_ADMIN_TOKEN }}
              args: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
